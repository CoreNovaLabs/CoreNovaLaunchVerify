# CoreNova Launch · 平台层配置（Platform Contract 的输入）
# 契约：contracts/platform-contract.md §2.1 / §3 / §7

# v1 固定单区域 + 单架构（platform-contract.md §7，禁止 AI 自动扩展 ARM）
region: us-east-1
architecture: x86_64

# 引导期：用公开 AMI（无镜像软件费），Docker/Nginx 由 cfn-init 现装。
# 切自建/收费 AMI 时改为 custom，并把 ssm_parameter 指向 Repo B 写的 /corenova/ami/base/latest
base_ami_source: public

public_ami:
  # AWS 官方维护的公共 SSM 参数：解析即得当前 region 内最新的 Ubuntu 24.04 LTS amd64 AMI
  ssm_parameter: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  owner_account: "0996389817"        # Canonical
  name_pattern: "ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"

custom_ami:
  ssm_parameter: /corenova/ami/base/latest

# 公开 AMI 会被厂商滚动替换 → 硬性复验周期（platform-contract.md §2.1 约束 3）
reverify_interval_days: 30

# Golden Verification 的 canary 栈
canary:
  stack_name: corenova-canary
  instance_type: t3.small
  disk_gb: 20
  signal_timeout_minutes: 20
  keep_stack: false                  # 默认跑完清理；调试时可 true
