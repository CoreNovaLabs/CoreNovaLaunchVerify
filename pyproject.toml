# Repo C 的 Python 打包声明。
#
# 依赖分层的依据（repo-structure.md §4）：
# - core：验证/发布链路的运行时（PyYAML 解析一切 yaml；boto3 供 golden/platform/后端用）
# - apps extra：应用验证特有（requests 供 scaffold 生成的测试模板用；playwright 截图，
#   screenshots.py 内懒加载）
# - dev extra：本仓测试套件
#
# scripts/ 下的入口脚本不含 sys.path hack：它们假定 corenova 已安装
# （CI/本地统一走 `pip install -r requirements.txt` → `-e .[dev,apps]`）。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corenova-verify"
version = "1.0.0"
description = "CoreNova Launch 验证枢纽：应用验证 / 平台金丝雀 / 发布两阶段提交"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
apps = [
    "requests>=2.31",
    "playwright>=1.40",
]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.2",
    "ruff>=0.16",
]

[tool.setuptools]
packages = ["corenova"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP"]
# 行宽不强制：超宽行分散在多个文件（golden.py 33 处、report.py 内嵌 HTML 模板等），
# 中文注释与模板字符串的行长由作者把控；强制 E501 只会 churn 刻意不重构的模块。
ignore = ["E501"]
