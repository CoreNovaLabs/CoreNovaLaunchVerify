            /opt/corenova/bin/30-app-container.sh:
              content: "# BEGIN SYNCED ASSET 30-app-container.sh\n#!/bin/bash\n# cfn-init asset: renders the systemd unit that runs the application container.\n# Nothing about the app image or port is baked in - both arrive as CFN parameters, so the same\n# template verifies Ghost today and any other registered app tomorrow.\nset -xeuo pipefail\n\nAPP_NAME=\"${CFNOVA_APP_NAME:?}\"\nIMAGE_REFERENCE=\"${CFNOVA_IMAGE_REFERENCE:?}\"\nCONTAINER_PORT=\"${CFNOVA_CONTAINER_PORT:?}\"\nDATA_DIR=\"${CFNOVA_DATA_DIR:-/var/lib/corenova/app/data}\"\nDATA_MOUNT=\"${CFNOVA_DATA_CONTAINER_PATH:-/data}\"\nAPP_URL=\"${CFNOVA_APP_URL:-}\"\nEXTRA_ENV_FILE=\"${CFNOVA_EXTRA_ENV_FILE:-}\"\nLOG_GROUP=\"${CFNOVA_LOG_GROUP:-/corenova/apps}\"\nAWS_REGION=\"${CFNOVA_AWS_REGION:-us-east-1}\"\nHEALTH_PATH=\"${CFNOVA_HEALTH_PATH:-/}\"\nENV_FILE=\"/opt/corenova/env/${APP_NAME}.env\"\n\ninstall -d -m 0755 \"$DATA_DIR\"\nmkdir -p /opt/corenova/env\n\ncat > \"$ENV_FILE\" <<EOF\nCORENOVA_APP_IMAGE=${IMAGE_REFERENCE}\nCORENOVA_CONTAINER_PORT=${CONTAINER_PORT}\nCORENOVA_DATA_DIR=${DATA_DIR}\nCORENOVA_APP_URL=${APP_URL}\nEOF\nif [ -n \"$EXTRA_ENV_FILE\" ] && [ -s \"$EXTRA_ENV_FILE\" ]; then\n  cat \"$EXTRA_ENV_FILE\" >> \"$ENV_FILE\"\nfi\nchown root:corenova \"$ENV_FILE\"\nchmod 0640 \"$ENV_FILE\"\n\ncat > \"/etc/systemd/system/corenova-${APP_NAME}.service\" <<EOF\n[Unit]\nDescription=CoreNova application container (${APP_NAME})\nAfter=docker.service network-online.target\nRequires=docker.service\n\n[Service]\nType=simple\nRestart=always\nRestartSec=5\nEnvironmentFile=${ENV_FILE}\nExecStartPre=-/usr/bin/docker rm -f ${APP_NAME}\nExecStartPre=/usr/bin/docker pull ${IMAGE_REFERENCE}\nExecStart=/usr/bin/docker run --rm --name ${APP_NAME} \\\\\n  --label corenova.app=${APP_NAME} \\\\\n  --log-driver awslogs --log-opt awslogs-group=${LOG_GROUP} --log-opt awslogs-stream=${APP_NAME} --log-opt awslogs-region=${AWS_REGION} \\\\\n  --health-cmd \"curl -sf http://127.0.0.1:${CONTAINER_PORT}${HEALTH_PATH} || exit 1\" \\\\\n  --health-interval 30s --health-timeout 5s --health-retries 3 --health-start-period 60s \\\\\n  --stop-timeout 30 \\\\\n  -p 127.0.0.1:${CONTAINER_PORT}:${CONTAINER_PORT} \\\\\n  -v ${DATA_DIR}:${DATA_MOUNT} \\\\\n  --env-file ${ENV_FILE} \\\\\n  ${IMAGE_REFERENCE}\nExecStop=/usr/bin/docker stop ${APP_NAME}\n\n[Install]\nWantedBy=multi-user.target\nEOF\n\nsystemctl daemon-reload\nsystemctl enable \"corenova-${APP_NAME}\"\nsystemctl restart \"corenova-${APP_NAME}\"\nsleep 5\nsystemctl is-active \"corenova-${APP_NAME}\"\ndocker ps --filter \"name=^/${APP_NAME}$\" --format '{{.Names}} {{.Status}}'\n# END SYNCED ASSET 30-app-container.sh\n"
              mode: '000755'
              owner: root
              group: root
            /opt/corenova/bin/40-ready-and-signal.sh:
              content: "# BEGIN SYNCED ASSET 40-ready-and-signal.sh\n#!/bin/bash\n# cfn-init asset: prove the platform end-to-end locally, then answer the WaitConditionHandle.\n# This is the only place a deployment may declare itself ready; Golden Verification reads the\n# signal as cfn_signal_received and /run/corenova-cfn-init.rc as cfn_init_completed.\nset -uo pipefail\n\nSTACK=\"${CFNOVA_STACK_NAME:?}\"\nREGION=\"${CFNOVA_AWS_REGION:?}\"\nAPP_NAME=\"${CFNOVA_APP_NAME:?}\"\nHEALTH_PATH=\"${CFNOVA_HEALTH_PATH:-/}\"\nHANDLE_URL=\"${CFNOVA_WAIT_HANDLE:?}\"\n# init.env carries the WaitCondition budget in minutes; leave a two minute margin so a failing\n# probe still signals FAILURE before the stack itself times out.\nDEADLINE=$(( $(date +%s) + ${CFNOVA_READY_DEADLINE:-1200} - 120 ))\n\ncode=000\nok=0\nreason=\"readiness probe timed out\"\nwhile [ \"$(date +%s)\" -lt \"$DEADLINE\" ]; do\n  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \"http://127.0.0.1:80${HEALTH_PATH}\" || echo 000)\n  case \"$code\" in\n    2*|3*) reason=\"nginx reverse proxy answered HTTP $code on :80\"; ok=1; break ;;\n  esac\n  sleep 5\ndone\n\ninit_rc=\"$(cat /run/corenova-cfn-init.rc 2>/dev/null || echo unknown)\"\n[ \"$init_rc\" = \"0\" ] || ok=0\n\nstatus=FAILURE\n[ \"$ok\" = 1 ] && status=SUCCESS\ndetail=\"{\\\"Status\\\":\\\"${status}\\\",\\\"Reason\\\":\\\"${reason}; cfn-init rc=${init_rc}\\\",\\\"UniqueId\\\":\\\"${STACK}-${APP_NAME}\\\",\\\"Data\\\":{\\\"http_code\\\":\\\"${code}\\\",\\\"cfn_init_rc\\\":\\\"${init_rc}\\\"}}\"\n\nif command -v cfn-signal >/dev/null 2>&1; then\n  # 预签名 URL 与逻辑资源（--stack/--resource）二选一，同时传会被拒绝\n  # （实测 \"Cannot specify both a WaitConditionHandle URL and a logical resource id\"）。\n  # 用 URL：无需实例凭据。\n  cfn-signal -e \"$([ \"$ok\" = 1 ] && echo 0 || echo 1)\" \"$HANDLE_URL\" && exit 0\nfi\n\n# Fallback keeps the WaitCondition satisfiable even when aws-cfn-bootstrap failed to install:\n# the handle URL is a presigned PUT, so it needs no credentials on the instance.\ncurl -sS -X PUT -H 'Content-Type:' -d \"$detail\" \"$HANDLE_URL\"\n# END SYNCED ASSET 40-ready-and-signal.sh\n"
              mode: '000755'
              owner: root
              group: root
        30-run-assets:
          commands:
            00-packages-and-docker-runtime:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/00-packages-and-docker-runtime.sh'
              cwd: /tmp
              timeout: '1200'
            10-nginx-base:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/10-nginx-base.sh'
              cwd: /tmp
              timeout: '600'
            20-cloudwatch-agent:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/20-cloudwatch-agent.sh'
              cwd: /tmp
              timeout: '600'
            30-app-container:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/30-app-container.sh'
              cwd: /tmp
              timeout: '1200'
        40-signal:
          commands:
            00-ready-and-signal:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/40-ready-and-signal.sh'
              cwd: /tmp
              timeout: '1800'
    Properties:
      ImageId:
        Ref: AmiId
      InstanceType:
        Ref: InstanceType
      IamInstanceProfile:
        Ref: InstanceProfile
      SubnetId:
        Ref: SubnetId
      SecurityGroupIds:
      - Ref: SecurityGroupId
      SourceDestCheck: true
      DisableApiTermination:
        Fn::If:
        - ProtectInstance
        - true
        - false
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
      - DeviceName: /dev/sda1
        Ebs:
          VolumeType: gp3
          VolumeSize:
            Ref: DiskGb
          Encrypted: true
          DeleteOnTermination: true
      - DeviceName: /dev/sdf
        Ebs:
          VolumeType: gp3
          VolumeSize:
            Ref: DataVolumeSize
          Encrypted: true
          DeleteOnTermination: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: corenova-${AppName}
      - Key: corenova:app
        Value:
          Ref: AppName
      - Key: corenova:image-tag
        Value:
          Fn::Select:
          - 0
          - Fn::Split:
            - '@'
            - Ref: ImageReference
      - Key: corenova:network-stack
        Value:
          Ref: NetworkStackName
      - Key: corenova:golden-run
        Value:
          Fn::If:
          - GoldenRunGiven
          - Ref: GoldenRunId
          - none
      UserData:
        Fn::Base64:
          Fn::Sub: "#!/bin/bash\n# --- CoreNova Launch bootstrap ------------------------------------------------\n# Installs only what cfn-init itself needs, then hands over to cfn-init, so every\n# platform component (Docker / Nginx / CloudWatch / app container / signal) is proven\n# through the same code path on a public AMI and on a future custom AMI.\nset -u\nexec > >(tee /var/log/corenova-user-data.log | logger -t corenova-user-data) 2>&1\nmkdir -p /var/log/corenova /opt/corenova/bin /opt/corenova/etc /opt/corenova/env\ncd /tmp\n\nexport DEBIAN_FRONTEND=noninteractive\napt-get update -y || true\nif ! apt-get install -y python3-pip python3-yaml curl; then\n  echo \"[corenova] FATAL: cannot install cfn-init prerequisites\"\n  echo 100 > /run/corenova-cfn-init.rc\n  curl -sS -X PUT -H 'Content-Type:' \\\n    -d '{\"Status\":\"FAILURE\",\"Reason\":\"bootstrap packages unavailable\",\"UniqueId\":\"corenova-bootstrap\",\"Data\":\"100\"}' \\\n    '${WaitHandle}'\n  exit 100\nfi\n# PyPI 上 aws-cfn-bootstrap 只有 sdist 1.4-31，其依赖 python-daemon<2.0 在\n# Ubuntu 24.04 / Python 3.12 下构建失败（实测：cfn-init 缺失 → 整条装机链 exit 127）。\n# AWS 官方 tarball 才是这台机器上真正可用的安装路径。\npip3 install --break-system-packages aws-cfn-bootstrap >/dev/null 2>&1 || true\nif ! command -v cfn-init >/dev/null 2>&1; then\n  curl -sSL -o /tmp/aws-cfn-bootstrap.tar.gz \\\n    https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz \\\n    && pip3 install --break-system-packages --quiet /tmp/aws-cfn-bootstrap.tar.gz\nfi\nfor tool in cfn-init cfn-signal cfn-hup; do\n  if [ -x /usr/local/bin/\"$tool\" ]; then ln -sf /usr/local/bin/\"$tool\" /usr/bin/\"$tool\"; fi\ndone\nif ! command -v cfn-init >/dev/null 2>&1; then\n  echo \"[corenova] FATAL: cfn-init unavailable after both install paths\"\n  echo 101 > /run/corenova-cfn-init.rc\n  curl -sS -X PUT -H 'Content-Type:' \\\n    -d '{\"Status\":\"FAILURE\",\"Reason\":\"cfn-init unavailable\",\"UniqueId\":\"corenova-bootstrap\",\"Data\":\"101\"}' \\\n    '${WaitHandle}'\n  exit 101\nfi\n\n# --- Mount data volume -------------------------------------------------------\n# The data volume (/dev/sdf) persists across instance terminations (DeleteOnTermination: false).\n# First boot: format ext4. Subsequent boots: mount the existing filesystem.\nDATA_DEV=/dev/sdf\nDATA_MOUNT=/var/lib/corenova/app/data\nif [ -b \"$DATA_DEV\" ]; then\n  if ! blkid \"$DATA_DEV\" >/dev/null 2>&1; then\n    echo \"[corenova] formatting data volume $DATA_DEV as ext4\"\n    mkfs.ext4 -m 0 -L corenova-data \"$DATA_DEV\"\n  fi\n  mkdir -p \"$DATA_MOUNT\"\n  mount -o noatime \"$DATA_DEV\" \"$DATA_MOUNT\"\n  if ! grep -q \"$DATA_MOUNT\" /etc/fstab; then\n    echo \"$DATA_DEV $DATA_MOUNT ext4 defaults,noatime 0 2\" >> /etc/fstab\n  fi\n  echo \"[corenova] data volume mounted at $DATA_MOUNT\"\nelse\n  echo \"[corenova] WARNING: $DATA_DEV not found — data volume skipped\"\nfi\n\nOVERRIDE=\"\"\nif [ -n \"${InitOverrideUrl}\" ]; then\n  if curl -fsSL \"${InitOverrideUrl}\" -o /opt/corenova/etc/init-override.json; then\n    OVERRIDE=\"--override file:///opt/corenova/etc/init-override.json\"\n  fi\nfi\n\n# A bracketed shell array lookup cannot appear anywhere inside an Fn::Sub string: CFN\n# parses every brace token as a variable name before escaping applies, and the index is\n# not a legal name. The exit status is therefore captured with `|| rc=$?` instead.\nINIT_RC=0\n/usr/local/bin/cfn-init -v \\\n  --stack \"${AWS::StackName}\" --resource Instance --region \"${AWS::Region}\" \\\n  --configsets default $OVERRIDE \\\n  > >(tee /var/log/corenova/cfn-init.log) 2>&1 || INIT_RC=$?\necho \"$INIT_RC\" > /run/corenova-cfn-init.rc\necho \"[corenova] cfn-init(default) exit=$INIT_RC\"\n\nsystemctl daemon-reload || true\nfor unit in docker nginx corenova-${AppName}; do\n  systemctl enable --now \"$unit\" 2>&1 | tee -a /var/log/corenova/systemd.log || true\ndone\n\n# Signalling runs in its own process: the WaitCondition timeout is the single authority\n# for \"the platform path completed in time\", and user-data must not mask a failed\n# cfn-init as a generic instance error.\n. /opt/corenova/etc/init.env\n/opt/corenova/bin/40-ready-and-signal.sh 2>&1 | tee /var/log/corenova/signal.log &\nexit 0\n"
Outputs:
  InstanceId:
    Description: Probe target for SSM SendCommand (there is no SSH).
    Value:
      Ref: Instance
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InstanceId
  PublicDnsName:
    Value:
      Fn::GetAtt:
      - Instance
      - PublicDnsName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PublicDnsName
  PublicIp:
    Value:
      Fn::GetAtt:
      - Instance
      - PublicIp
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PublicIp
  PrivateIp:
    Value:
      Fn::GetAtt:
      - Instance
      - PrivateIp
  ResolvedLaunchUrl:
    Description: Public entry point (falls back to the instance public DNS when LaunchUrl is empty).
    Value:
      Fn::If:
      - LaunchUrlGiven
      - Ref: LaunchUrl
      - Fn::Sub: http://${Instance.PublicDnsName}
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-LaunchUrl
  RoleArn:
    Value:
      Fn::GetAtt:
      - Role
      - Arn
  InstanceProfileName:
    Value:
      Ref: InstanceProfile
  WaitConditionHandleUrl:
    Description: Debug aid - the presigned URL a human may signal while iterating on a canary.
    Value:
      Ref: WaitHandle
