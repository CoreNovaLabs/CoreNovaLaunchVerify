# AdGuard Home · CoreNova 验证用 compose
#
# 单一事实源约束（contracts/app-schema.md §0）：
#   - image 只用 ${CORENOVA_APP_IMAGE}（= 精确 tag@digest，由验证器注入）
#   - 端口只用 ${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}
#   - 数据挂载到本次验证独占的临时目录 ${CORENOVA_DATA_DIR}，跑完即弃
#
# 实测：adguard/adguardhome:v0.107.79 官方镜像以 root 运行，监听
# 3000（安装向导/管理界面）与 53（DNS）；/ 302 → /install.html。
# 验证只挂 conf 数据卷（work 统计卷一次性即可，DNS 不对外服务）。
services:
  adguard-home:
    image: ${CORENOVA_APP_IMAGE}
    restart: "no"
    ports:
      - "${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}"
    volumes:
      - ${CORENOVA_DATA_DIR}:/opt/adguardhome/conf
