# Gitea · CoreNova 验证用 compose
#
# 单一事实源约束（contracts/app-schema.md §0）：
#   - image 只用 ${CORENOVA_APP_IMAGE}（= 精确 tag@digest，由验证器注入）
#   - 端口只用 ${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}
#   - 应用自引用 URL 只用 ${CORENOVA_APP_URL}（经 GITEA__server__ROOT_URL 注入）
#   - 数据挂载到本次验证独占的临时目录 ${CORENOVA_DATA_DIR}，跑完即弃
#
# 实测：gitea 官方镜像默认 SQLite，容器以 git 用户运行，/data 归属正确，无需额外 env。
services:
  gitea:
    image: ${CORENOVA_APP_IMAGE}
    restart: "no"
    ports:
      - "${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}"
    environment:
      GITEA__server__ROOT_URL: ${CORENOVA_APP_URL}
    volumes:
      - ${CORENOVA_DATA_DIR}:/data
