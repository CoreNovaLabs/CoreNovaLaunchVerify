# changedetection.io · CoreNova 验证用 compose
#
# 单一事实源约束（contracts/app-schema.md §0）：
#   - image 只用 ${CORENOVA_APP_IMAGE}（= 精确 tag@digest，由验证器注入）
#   - 端口只用 ${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}
#   - 数据挂载到本次验证独占的临时目录 ${CORENOVA_DATA_DIR}，跑完即弃
#
# 实测：dgtlmoon/changedetection.io:0.60.4 主进程 CMD 为
# `python ./changedetection.py -d /datastore`，数据目录固定 /datastore
# （镜像内无 /data，别挂错）；Web UI 监听 5000。
services:
  changedetection:
    image: ${CORENOVA_APP_IMAGE}
    restart: "no"
    ports:
      - "${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}"
    volumes:
      - ${CORENOVA_DATA_DIR}:/datastore
