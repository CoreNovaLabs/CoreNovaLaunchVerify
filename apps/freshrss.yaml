# CoreNova Launch · 应用注册（App Schema 唯一事实源）
# 契约：contracts/app-schema.md
#
# 版本可观测性：/api/v1/meta/nocodb… 不适用；FreshRSS 的 /api/greader.php
# 需鉴权，但常量文件 /var/www/FreshRSS/constants.php 第 9 行定义
# FRESHRSS_VERSION = '1.30.0'（实测），exec_command 用 sed 取它。
# 全新容器首启 / 302 → /i/（安装向导），探针跟随重定向落点 200。

app:
  name: "freshrss"
  category: "productivity"
  app_type: "stateful_app"
  icon: "/icons/freshrss.svg"
  i18n:
    en:
      display_name: "FreshRSS"
      description: "Self-hosted RSS feed aggregator with mobile-friendly web UI"
    zh:
      display_name: "FreshRSS 阅读器"
      description: "自托管 RSS 聚合阅读器"

source:
  repo: "FreshRSS/FreshRSS"
  version_strategy: "release_tag"
  release_filter:
    prerelease: false
    draft: false

deploy:
  docker_image: "freshrss/freshrss"
  # 上游 tag 1.30.0 → Docker Hub tag 1.30.0（实测存在）
  image_tag_template: "freshrss/freshrss:{version_no_v}"
  container_port: 80
  compose_file: "apps/freshrss/docker-compose.yml"

health_check:
  # / 302 → /i/ 安装向导（全新容器），探针跟随重定向落点 200
  endpoint: "/"
  expected_status: 200
  method: "GET"
  timeout_seconds: 5
  retries: 40
  interval_seconds: 3
  startup_timeout_seconds: 180
  version_assertion:
    kind: "exec_command"
    command: >-
      sed -n "s/^const FRESHRSS_VERSION = '\(.*\)';/\1/p" /var/www/FreshRSS/constants.php
    expected: "{version_no_v}"
    match: "exact"

tests:
  predefined_dir: "apps/freshrss/tests"
  scenarios:
    - slug: "install"
      url: "/"
      caption:
        en: "Installation wizard"
        zh: "安装向导"

deployment:
  size: "small"
  documentation_url: "https://freshrss.github.io/FreshRSS/"
  regions: ["us-east-1"]
  post_deploy:
    admin_path: "/"
    admin_setup:
      en: "The first visit opens the installation wizard (language, database — keep SQLite — then the admin account form). There are no preset credentials."
      zh: "首次访问进入安装向导：选择语言、数据库（保持默认 SQLite）、设置管理员账户；没有预置账号密码。"
    notes:
      - en: "Feeds database and config live on a retained volume (/var/www/FreshRSS/data). It keeps billing after stack deletion; snapshot it, then delete the volume when no longer needed."
        zh: "订阅数据库与配置保存在保留数据卷（/var/www/FreshRSS/data）中。删除栈后该卷仍会计费；请先创建快照，不再需要时再删除卷。"
  cost_estimate:
    monthly_usd: 23
    note:
      en: "Verified default in us-east-1: ~$15.2 t3.small + ~$4 for the 20 GB root and 30 GB data gp3 volumes + $3.65 public IPv4 per month."
      zh: "us-east-1 已验证默认配置：t3.small 约 $15.2/月 + 20GB 系统盘与 30GB 数据盘 gp3 约 $4/月 + 公网 IPv4 约 $3.65/月。"
  data_path: "/var/www/FreshRSS/data"

website:
  featured: true
  screenshots_order: ["install"]
  tags: ["rss", "reader", "aggregator"]
  features:
    - en: "Unlimited feeds with auto-refresh scheduling"
      zh: "不限订阅源，支持自动定时刷新"
    - en: "Mobile-friendly UI plus Fever/GReader API for third-party apps"
      zh: "移动端友好 UI，兼容 Fever/GReader API 接入第三方客户端"
    - en: "Full-text extraction, tagging and dark mode"
      zh: "全文抓取、标签与深色模式"
